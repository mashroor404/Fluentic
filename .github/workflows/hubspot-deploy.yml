name: Deploy to HubSpot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    # Forks do not have the upstream repository's HubSpot credentials and must
    # never deploy. This remains enabled when the workflow is merged upstream.
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: HubSpot Deploy Action
        uses: HubSpot/hubspot-cms-deploy-action@v2.0.1
        with:
          src_dir: .
          dest_dir: /Fluentic
          account_id: ${{ vars.hubspot_account_id || secrets.hubspot_portal_id }}
          personal_access_key: ${{ secrets.hubspot_personal_access_key }}
