<!---------------------------  
Primary animated button START
--------------------------->
{% macro animated_button(text, link) %}
  <a href="{{ link }}" class="p-btn">
    <!-- Expanding Background -->
    <div class="btn-bg-fill"></div>
    
    <!-- Left Icon (Visible by default, masking container) -->
    <div class="btn-icon-left">
      <!-- The sliding track holding two arrows -->
      <div class="btn-icon-track">
        <img src="https://cdn.prod.website-files.com/6a1dd6bce5cdeadcef336317/6a20ef4f1998cb56dd0d3f3a_83810f41f50243f20509717f1fa10ebc_button-arrows.svg" alt="Arrow" class="btn-icon-img">
        <img src="https://cdn.prod.website-files.com/6a1dd6bce5cdeadcef336317/6a20ef4f1998cb56dd0d3f3a_83810f41f50243f20509717f1fa10ebc_button-arrows.svg" alt="Arrow" class="btn-icon-img">
      </div>
    </div>
    
    <!-- Dynamic Button Text -->
    <span class="btn-text">{{ text }}</span>
    
    <!-- Right Icon (Hidden by default, slides in on hover) -->
    <div class="btn-icon-right">
      <img src="https://cdn.prod.website-files.com/6a1dd6bce5cdeadcef336317/6a20ef4f1998cb56dd0d3f3a_83810f41f50243f20509717f1fa10ebc_button-arrows.svg" alt="Arrow" class="btn-icon-img">
    </div>
  </a>
{% endmacro %}

<!-- ------------------------- 
Primary animated button END
--------------------------->




<!-- ------------------------- 
Seconday animated button START
--------------------------->
{% macro secondary_button(text, link) %}
  <a href="{{ link }}" class="s-btn">
    <!-- Expanding Background for Hover -->
    <div class="s-btn-bg-fill"></div>
    
    <!-- Left Icon (Visible by default, masking container) -->
    <div class="s-btn-icon-left">
      <!-- The sliding track holding two arrows -->
      <div class="s-btn-icon-track">
        <img src="https://cdn.prod.website-files.com/6a1dd6bce5cdeadcef336317/6a20ef4f1998cb56dd0d3f3a_83810f41f50243f20509717f1fa10ebc_button-arrows.svg" alt="Arrow" class="s-btn-icon-img">
        <img src="https://cdn.prod.website-files.com/6a1dd6bce5cdeadcef336317/6a20ef4f1998cb56dd0d3f3a_83810f41f50243f20509717f1fa10ebc_button-arrows.svg" alt="Arrow" class="s-btn-icon-img">
      </div>
    </div>
    
    <!-- Button Text -->
    <span class="s-btn-text">{{ text }}</span>
    
    <!-- Right Icon (Hidden by default, slides in on hover) -->
    <div class="s-btn-icon-right">
      <img src="https://cdn.prod.website-files.com/6a1dd6bce5cdeadcef336317/6a20ef4f1998cb56dd0d3f3a_83810f41f50243f20509717f1fa10ebc_button-arrows.svg" alt="Arrow" class="s-btn-icon-img">
    </div>
  </a>
{% endmacro %}

<!--  -------------------------
Secondary animated button END
------------------------------>



<!--  -------------------------
Eyebrow badge START
------------------------------>
{% macro eyebrow_label(text) %}
  <div class="eyebrow-custom">
    <!-- Eyebrow Icon -->
    <img loading="lazy" src="https://cdn.prod.website-files.com/6a1dd6bce5cdeadcef336317/6a20fbee52b758d1d52eda94_energy-ellipse.svg" alt="Energy Ellipse Icon" class="eyebrow-icon">
    
    <!-- Eyebrow Content & Cursor -->
    <div class="eyebrow-content">
      <p class="eyebrow-text">{{ text }}</p>
      <span class="eyebrow-cursor"></span>
    </div>
  </div>
{% endmacro %}
<!--  -------------------------
Eyebrow badge END
------------------------------>
